<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Фотокарты дефектов</title>
  <link rel="manifest" href="manifest.json" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #e2e8f0; color: #0f172a; padding-bottom: 40px; }
    header { background: #0f172a; color: #fff; padding: 12px 14px; position: sticky; top: 0; z-index: 20; }
    .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    select, input { width: 100%; padding: 9px 10px; border-radius: 8px; border: 1px solid #334155; background: #1e293b; color: #fff; font-size: 14px; }
    .tabs { display: flex; gap: 6px; margin-top: 8px; }
    .tab { flex: 1; padding: 7px; border-radius: 8px; border: none; background: #334155; color: #fff; font-size: 13px; font-weight: 600; cursor: pointer; }
    .tab.active { background: #38bdf8; color: #0f172a; }
    .tab.ok.active { background: #22c55e; color: #fff; }
    .tab.no.active { background: #ef4444; color: #fff; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; padding: 12px; }
    .card { background: #fff; border-radius: 10px; overflow: hidden; box-shadow: 0 2px 6px rgba(0,0,0,0.12); }
    .card-head { padding: 10px 12px; display: flex; justify-content: space-between; align-items: center; background: #f8fafc; border-bottom: 1px solid #e2e8f0; font-weight: 700; font-size: 14px; }
    .badge-ok { background: #dcfce7; color: #15803d; padding: 3px 8px; border-radius: 6px; font-size: 12px; }
    .badge-no { background: #fee2e2; color: #b91c1c; padding: 3px 8px; border-radius: 6px; font-size: 12px; }
    .card img { width: 100%; height: auto; display: block; cursor: zoom-in; }
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 50; flex-direction: column; }
    .modal.open { display: flex; }
    .modal-bar { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 10px 14px; color: #fff; background: #0f172a; }
    .modal-btns { display: flex; gap: 8px; }
    .modal-rotate { background: #334155; color: #fff; border: none; padding: 6px 12px; border-radius: 6px; font-weight: 600; cursor: pointer; }
    .modal-close { background: #ef4444; color: #fff; border: none; padding: 6px 12px; border-radius: 6px; font-weight: 700; cursor: pointer; }
    .modal-body { flex: 1; overflow: auto; padding: 8px; display: flex; justify-content: center; align-items: center; }
    .modal-body img { max-width: 100%; max-height: 100%; object-fit: contain; transition: transform 0.2s; }
  </style>
</head>
<body>

<header>
  <div class="controls">
    <select id="modelSelect"></select>
    <input type="text" id="searchInput" placeholder="Поиск № карты..." />
  </div>
  <div class="tabs">
    <button class="tab active" data-filter="ALL">Все</button>
    <button class="tab ok" data-filter="OK">Разрешено</button>
    <button class="tab no" data-filter="NO">Запрещено</button>
  </div>
</header>

<div class="grid" id="cardsGrid"></div>

<div class="modal" id="imgModal">
  <div class="modal-bar">
    <span id="modalTitle" style="font-weight:700; font-size:14px;"></span>
    <div class="modal-btns">
      <button class="modal-rotate" onclick="rotateImg()">Повернуть ↻</button>
      <button class="modal-close" onclick="closeModal()">Закрыть ✕</button>
    </div>
  </div>
  <div class="modal-body">
    <img id="modalImg" src="" alt="" />
  </div>
</div>

<script src="data.js"></script>
<script>
  const modelSelect = document.getElementById('modelSelect');
  const searchInput = document.getElementById('searchInput');
  const cardsGrid = document.getElementById('cardsGrid');
  let statusFilter = 'ALL';
  let currentAngle = 0;

  MODELS.forEach(m => {
    const opt = document.createElement('option');
    opt.value = m;
    opt.textContent = m;
    modelSelect.appendChild(opt);
  });

  document.querySelectorAll('.tab').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      statusFilter = btn.dataset.filter;
      render();
    });
  });

  modelSelect.addEventListener('change', render);
  searchInput.addEventListener('input', render);

  function getImgUrl(pageNum) {
    const numStr = String(pageNum).padStart(2, '0');
    return 'pages/' + encodeURIComponent(`Фотокарты №1-36_Страница_${numStr}.jpg`);
  }

  function render() {
    const model = modelSelect.value;
    const q = searchInput.value.trim().toLowerCase();
    cardsGrid.innerHTML = '';

    CARDS_DATA.forEach(card => {
      if (q && !card.num.toLowerCase().includes(q) && !card.title.toLowerCase().includes(q)) return;

      const isOk = model === 'Все модели' ? card.allowed.length > 0 : card.allowed.includes(model);
      if (statusFilter === 'OK' && !isOk) return;
      if (statusFilter === 'NO' && isOk) return;

      const imgSrc = getImgUrl(card.page);
      const badge = model === 'Все модели'
        ? ''
        : (isOk ? `<span class="badge-ok">Разрешено</span>` : `<span class="badge-no">Запрещено</span>`);

      const el = document.createElement('div');
      el.className = 'card';
      el.innerHTML = `
        <div class="card-head">
          <span>Фотокарта ${card.num}</span>
          ${badge}
        </div>
        <img src="${imgSrc}" loading="lazy" alt="Фотокарта ${card.num}" onclick="openModal('${imgSrc}', 'Фотокарта ${card.num}')" />
      `;
      cardsGrid.appendChild(el);
    });
  }

  function openModal(src, title) {
    currentAngle = 0;
    const img = document.getElementById('modalImg');
    img.style.transform = 'rotate(0deg)';
    img.src = src;
    document.getElementById('modalTitle').textContent = title;
    document.getElementById('imgModal').classList.add('open');
  }

  function rotateImg() {
    currentAngle = (currentAngle + 90) % 360;
    document.getElementById('modalImg').style.transform = `rotate(${currentAngle}deg)`;
  }

  function closeModal() {
    document.getElementById('imgModal').classList.remove('open');
  }

  render();
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
