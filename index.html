<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>ОТК Фотокарты дефектов</title>
  <link rel="manifest" href="manifest.json" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #f1f5f9; color: #0f172a; padding-bottom: 40px; }
    header { background: #0f172a; color: #fff; padding: 14px 16px; position: sticky; top: 0; z-index: 20; box-shadow: 0 2px 8px rgba(0,0,0,0.15); }
    header h1 { font-size: 17px; font-weight: 700; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
    .badge-offline { font-size: 11px; background: #1e293b; color: #38bdf8; padding: 3px 8px; border-radius: 12px; }
    .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    select, input { width: 100%; padding: 9px 10px; border-radius: 8px; border: 1px solid #334155; background: #1e293b; color: #fff; font-size: 14px; }
    input::placeholder { color: #94a3b8; }
    .search-row { grid-column: 1 / -1; display: flex; gap: 6px; }
    .status-tabs { display: flex; gap: 6px; padding: 10px 16px 0; overflow-x: auto; }
    .tab { padding: 7px 12px; border-radius: 20px; border: 1px solid #cbd5e1; background: #fff; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; }
    .tab.active { background: #0f172a; color: #fff; border-color: #0f172a; }
    .tab.ok.active { background: #16a34a; border-color: #16a34a; }
    .tab.no.active { background: #dc2626; border-color: #dc2626; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); gap: 12px; padding: 12px 16px; }
    .card { background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,0.08); border-left: 5px solid #94a3b8; display: flex; flex-direction: column; }
    .card.status-ok { border-left-color: #16a34a; }
    .card.status-no { border-left-color: #dc2626; }
    .card-top { padding: 12px; display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
    .card-num { font-weight: 800; font-size: 15px; color: #0f172a; background: #e2e8f0; padding: 2px 8px; border-radius: 6px; }
    .status-pill { font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 6px; }
    .pill-ok { background: #dcfce7; color: #15803d; }
    .pill-no { background: #fee2e2; color: #b91c1c; }
    .pill-mix { background: #fef3c7; color: #b45309; }
    .card-title { padding: 0 12px 6px; font-size: 15px; font-weight: 700; line-height: 1.3; }
    .card-zone { padding: 0 12px 8px; font-size: 12px; color: #64748b; }
    .card-note { margin: 0 12px 10px; padding: 8px 10px; background: #f8fafc; border-radius: 8px; font-size: 13px; color: #334155; border: 1px solid #e2e8f0; }
    .card-thumb { width: 100%; height: 210px; object-fit: cover; object-position: top; background: #e2e8f0; cursor: zoom-in; border-top: 1px solid #e2e8f0; }
    .btn-open { margin: 10px 12px 12px; padding: 10px; background: #0f172a; color: #fff; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; }
    /* Модальное окно для полноэкранного просмотра фотокарты */
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.92); z-index: 50; flex-direction: column; }
    .modal.open { display: flex; }
    .modal-bar { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; color: #fff; background: #0f172a; }
    .modal-close { background: #dc2626; color: #fff; border: none; padding: 7px 14px; border-radius: 8px; font-weight: 700; font-size: 14px; cursor: pointer; }
    .modal-body { flex: 1; overflow: auto; display: flex; justify-content: center; align-items: flex-start; padding: 10px; -webkit-overflow-scrolling: touch; }
    .modal-body img { max-width: 100%; height: auto; border-radius: 4px; }
  </style>
</head>
<body>

<header>
  <h1>
    <span>Справочник дефектов ОТК</span>
    <span class="badge-offline" id="netStatus">Offline Ready</span>
  </h1>
  <div class="controls">
    <select id="modelSelect"></select>
    <select id="zoneSelect">
      <option value="ALL">Все зоны отливки</option>
      <option value="Лицевое ребро / Голова">Лицевое ребро / Голова</option>
      <option value="Радиусное / Боковое ребро">Радиусное / Боковое ребро</option>
      <option value="Задняя перегородка">Задняя перегородка</option>
      <option value="Покраска / Вкрапления">Покраска / Вкрапления</option>
      <option value="Все части отливки">Все части отливки</option>
    </select>
    <div class="search-row">
      <input type="text" id="searchInput" placeholder="Поиск по № (например 29) или слову (раковина, скол)..." />
    </div>
  </div>
</header>

<div class="status-tabs">
  <button class="tab active" data-filter="ALL">Все (<span id="cntAll">0</span>)</button>
  <button class="tab ok" data-filter="OK">Разрешено (<span id="cntOk">0</span>)</button>
  <button class="tab no" data-filter="NO">Запрещено (<span id="cntNo">0</span>)</button>
</div>

<div class="grid" id="cardsGrid"></div>

<div class="modal" id="imgModal">
  <div class="modal-bar">
    <span id="modalTitle" style="font-weight:700; font-size:14px;">Фотокарта</span>
    <button class="modal-close" onclick="closeModal()">Закрыть ✕</button>
  </div>
  <div class="modal-body">
    <img id="modalImg" src="" alt="Фотокарта" />
  </div>
</div>

<script src="data.js"></script>
<script>
  const modelSelect = document.getElementById('modelSelect');
  const zoneSelect = document.getElementById('zoneSelect');
  const searchInput = document.getElementById('searchInput');
  const cardsGrid = document.getElementById('cardsGrid');
  let statusFilter = 'ALL';

  MODELS.forEach(m => {
    const opt = document.createElement('option');
    opt.value = m;
    opt.textContent = m === 'Все модели' ? 'Модель: Все' : m;
    modelSelect.appendChild(opt);
  });

  document.querySelectorAll('.tab').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      statusFilter = btn.dataset.filter;
      render();
    });
  });

  modelSelect.addEventListener('change', render);
  zoneSelect.addEventListener('change', render);
  searchInput.addEventListener('input', render);

  function getCardStatus(card, model) {
    if (model === 'Все модели') {
      if (card.allowed.length === 0) return 'NO';
      if (card.forbidden.length === 0) return 'OK';
      return 'MIX';
    }
    if (card.allowed.includes(model)) return 'OK';
    if (card.forbidden.includes(model)) return 'NO';
    return 'MIX';
  }

  function render() {
    const model = modelSelect.value;
    const zone = zoneSelect.value;
    const q = searchInput.value.trim().toLowerCase();

    let okCount = 0, noCount = 0, allCount = 0;
    cardsGrid.innerHTML = '';

    CARDS_DATA.forEach(card => {
      if (zone !== 'ALL' && card.zone !== zone) return;
      if (q && !card.num.toLowerCase().includes(q) && !card.title.toLowerCase().includes(q) && !card.note.toLowerCase().includes(q)) return;

      const st = getCardStatus(card, model);
      allCount++;
      if (st === 'OK') okCount++;
      if (st === 'NO') noCount++;

      if (statusFilter === 'OK' && st !== 'OK') return;
      if (statusFilter === 'NO' && st !== 'NO') return;

      const cardEl = document.createElement('div');
      cardEl.className = `card ${st === 'OK' ? 'status-ok' : st === 'NO' ? 'status-no' : ''}`;

      let pillHtml = '';
      if (st === 'OK') pillHtml = `<span class="status-pill pill-ok">✓ Разрешено</span>`;
      else if (st === 'NO') pillHtml = `<span class="status-pill pill-no">✕ Брак / Запрещено</span>`;
      else pillHtml = `<span class="status-pill pill-mix">По моделям (${card.allowed.length} доп.)</span>`;

      const imgSrc = `pages/${card.page}.jpg`;

      cardEl.innerHTML = `
        <div class="card-top">
          <span class="card-num">Карта ${card.num}</span>
          ${pillHtml}
        </div>
        <div class="card-title">${card.title}</div>
        <div class="card-zone">Участок/зона: ${card.zone}</div>
        <div class="card-note">${card.note}</div>
        <img class="card-thumb" src="${imgSrc}" loading="lazy" alt="${card.num}" onclick="openModal('${imgSrc}', 'Карта ${card.num}: ${card.title.replace(/'/g, '')}')" />
        <button class="btn-open" onclick="openModal('${imgSrc}', 'Карта ${card.num}: ${card.title.replace(/'/g, '')}')">Открыть фотокарту целиком</button>
      `;
      cardsGrid.appendChild(cardEl);
    });

    document.getElementById('cntAll').textContent = allCount;
    document.getElementById('cntOk').textContent = okCount;
    document.getElementById('cntNo').textContent = noCount;
  }

  function openModal(src, title) {
    document.getElementById('modalImg').src = src;
    document.getElementById('modalTitle').textContent = title;
    document.getElementById('imgModal').classList.add('open');
  }

  function closeModal() {
    document.getElementById('imgModal').classList.remove('open');
  }

  render();

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').then(() => {
      document.getElementById('netStatus').textContent = 'Офлайн-режим готов';
    });
  }
</script>
</body>
</html>
